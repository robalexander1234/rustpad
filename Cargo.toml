[package]
name = "rustpad"
version = "0.5.0"
edition = "2021"
description = "A lightweight PSPad-inspired Rust programmer's editor with Session Persistence, cargo new, Point-and-Shoot Member Function Help, and F1 Doc Lookup"

[dependencies]
eframe = "0.29"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
